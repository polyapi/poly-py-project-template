[project]
name = "poly-py-project-template"
version = "0.1.0"
description = "Generic Python PolyAPI workflow project template"
# Runtime stays pinned in .python-version and CI; resolvers may use newer 3.12 patches.
requires-python = ">=3.12.12,<3.13"
dependencies = [
    "jsonschema==4.26.0",
    "polyapi-python==0.3.21.dev1",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "requests==2.33.0",
    "typing-extensions==4.15.0",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "flake8==7.3.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]

[tool.uv]
package = false

[tool.black]
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["cli/tests", "kickstart/tests", "workflows/src"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: opt-in tests against a deployed PolyAPI environment",
]
